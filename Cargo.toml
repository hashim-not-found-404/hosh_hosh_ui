[workspace]
members = [
    "crates/app_root",
    "crates/component/*",
    "crates/hosh_hosh_ui",
    "crates/interfaces",
    "crates/layouts",
    "crates/prelude",
    "crates/text_edit",
]
resolver = "3"

[workspace.dependencies]
# internal crates
component_dropdown_button.path = "./crates/component/dropdown_button"
component_input_field.path = "./crates/component/input_field"
component_input_list.path = "./crates/component/input_list"
component_label.path = "./crates/component/label"
component_list.path = "./crates/component/list"
component_primary_button.path = "./crates/component/primary_button"
component_secondary_button.path = "./crates/component/secondary_button"
component_style_parts.path = "./crates/component/style_parts"
component_tertiary_button.path = "./crates/component/tertiary_button"
component_toggle_button.path = "./crates/component/toggle_button"
hosh_hosh_ui.path = "./crates/hosh_hosh_ui"
interfaces.path = "./crates/interfaces"
layouts.path = "./crates/layouts"
prelude.path = "./crates/prelude"
text_edit.path = "./crates/text_edit"

# external out the domain
eframe = "0.37.0"
egui = "0.37.0"

[profile.dev.package."*"]
debug = true
opt-level = 0

[profile.test.package."*"]
opt-level = 0
